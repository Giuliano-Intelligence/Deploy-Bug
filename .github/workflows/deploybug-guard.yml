name: deploybug-guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: No code comments
        run: ./scripts/strip-comments --check .
      - name: Secret scan
        run: npx tsx scripts/secret-scan.ts
      - name: Gitleaks history scan
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact
      - run: npm run typecheck
      - run: npm test
  guard:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Load the verifier from the trusted base ref
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || echo "$BASE" | grep -qE '^0+$' || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse origin/main); fi
          mkdir -p /tmp/trusted
          git show "$BASE:.github/deploybug/verify-commits.mjs" > /tmp/trusted/verify-commits.mjs
          echo "verifier from $BASE"
      - name: Commits came through Deploy Bug
        env:
          DEPLOYBUG_SIGNING_KEY: ${{ secrets.DEPLOYBUG_SIGNING_KEY }}
          RANGE_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node /tmp/trusted/verify-commits.mjs
